<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // 必须早于 Prism 模块加载，避免自动高亮改写待 hydration 的节点。
      window.Prism = { manual: true }
      // 在首屏绘制前恢复主题，存储受限时仍跟随系统。
      try {
        const mode = localStorage.getItem('lulu-theme-mode')
        if (mode === 'light' || mode === 'dark') document.documentElement.dataset.luluTheme = mode
      } catch {}
      document.documentElement.classList.toggle('dark', document.documentElement.dataset.luluTheme
        ? document.documentElement.dataset.luluTheme === 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches)
      // 在首屏绘制前恢复主色，避免刷新后先闪现默认颜色。
      try {
        const primary = JSON.parse(localStorage.getItem('lulu-docs-primary-v1') || 'null')
        if (primary && typeof primary.hex === 'string' && /^#[\da-f]{6}$/i.test(primary.hex)
          && Number.isInteger(primary.hue) && primary.hue >= 0 && primary.hue < 360
          && Number.isInteger(primary.saturation) && primary.saturation >= 0 && primary.saturation <= 100
          && Number.isInteger(primary.lightnessLight) && primary.lightnessLight >= 0 && primary.lightnessLight <= 100
          && Number.isInteger(primary.lightnessDark) && primary.lightnessDark >= 0 && primary.lightnessDark <= 100) {
          const root = document.documentElement
          root.dataset.docsPrimary = ''
          root.style.setProperty('--docs-primary-hue', primary.hue)
          root.style.setProperty('--docs-primary-saturation', `${primary.saturation}%`)
          root.style.setProperty('--docs-primary-lightness-light', `${primary.lightnessLight}%`)
          root.style.setProperty('--docs-primary-lightness-dark', `${primary.lightnessDark}%`)
        }
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg">
    <!--app-head-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
