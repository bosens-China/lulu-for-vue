name: Docs Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Configure GitHub Pages URL
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == "$owner.github.io" ]]; then
            base="/"
          else
            base="/$repo/"
          fi
          echo "DOCS_BASE=$base" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=https://$owner.github.io$base" >> "$GITHUB_ENV"
          echo "VITE_GITHUB_URL=https://github.com/$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
      - run: pnpm typecheck:docs && pnpm build:docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
